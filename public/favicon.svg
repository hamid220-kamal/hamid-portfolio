<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.45"/>
    </filter>

    <!-- Metallic Sapphire-Indigo Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan to Cobalt Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Core Monogram Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 3D Squircle Base Container with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Subtle Cyber Corner Tick Accents -->
  <path d="M12 20V12H20" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M52 20V12H44" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M12 44V52H20" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M52 44V52H44" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Futuristic "H" Monogram (Hamid / AI Architecture) -->
  <!-- Left Pillar -->
  <rect x="18" y="17" width="7" height="30" rx="3.5" fill="url(#coreGrad)" />
  <!-- Right Pillar -->
  <rect x="39" y="17" width="7" height="30" rx="3.5" fill="url(#coreGrad)" />
  <!-- Central AI Neural Crossbar -->
  <rect x="23" y="28.5" width="18" height="7" rx="3" fill="url(#accentGrad)" />

  <!-- Central Intelligence Quantum Core Orb -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="32" cy="32" r="1.5" fill="#0284c7" />

  <!-- Orbiting Quantum Spark / Synapse Dots -->
  <circle cx="21.5" cy="20.5" r="1.8" fill="#38bdf8" />
  <circle cx="42.5" cy="43.5" r="1.8" fill="#a855f7" />
</svg>
